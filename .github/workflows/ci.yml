name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v6

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev pkg-config clang

      - name: Fetch LovyanGFX
        run: make -C tools/host deps

      - name: Run every check
        run: make verify

      - name: Test Pro touch controls
        run: make x4pro-test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Fetch LovyanGFX
        run: make -C tools/host deps

      - name: Build the X4 firmware
        run: make device-x4

  firmware-pro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install PlatformIO
        run: pip install pioarduino==6.1.19
      - name: Build standalone X4 Pro
        run: pio run -e x4pro
      - name: Verify installation images
        run: python tools/device/package_x4pro.py --tag ci
